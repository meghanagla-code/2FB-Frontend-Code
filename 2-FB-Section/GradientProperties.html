<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border:2px solid green;
            /* background-color: aquamarine; */
            width: 300px;
            height: 300px;
            border-radius: 50%;
        }
        .linear{
            background: linear-gradient(to right bottom,purple,orange,red,blue,yellow,grey,black);
        }
        .radial{
            background-image: radial-gradient(pink,green,yellow,lightgreen,violet,blue);
        }
        .conic{
            background: conic-gradient(yellow  , yellow 45deg,orange 45deg,orange 180deg,green 180deg, green 210deg,red 210deg, red 270deg, purple 270deg, purple 360deg);
        }
    </style>
</head>
<body>
    <h1>Linaer Gradient</h1>
    <div class="box linear"></div>
    <h1>Radial Gradient</h1>
    <div class="box radial"></div>
    <h1>Conic Gradient</h1>
    <div class="box conic"></div>
</body>
</html>
