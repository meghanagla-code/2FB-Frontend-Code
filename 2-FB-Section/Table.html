<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Information</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Product Data</h1>
    <table border="1">
        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>
        <tr>
            <td>Product 1</td>
            <td>$100</td>
            <td>In Stock</td>
        </tr>
        <tr>
            <td>Product 2</td>
            <td>$200</td>
            <td>Out of Stock</td>
            </tr>
        <tr>
            <td>Product 3</td>
            <td>$150</td>
            <td>In Stock</td>
        </tr>
    </table>
</body>
</html>
