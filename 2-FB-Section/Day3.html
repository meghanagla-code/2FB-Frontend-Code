<body>
    <!-- 8. Quotation Tag:- <q></q> -->
    <h2>The very famous South Indian Food is <q>Bisibele Bath</q> and Dosa</h2>

    <!-- 9. small tag <small></small> -->
     <p>The price is <b>450</b>, <small>only on wednesday in between 2-3 pm, else cost is 950</small></p>
     <p>HHHH<small>HHHH</small></p>

     <!-- 10. Subscript Tag :- -->
     <p>H<sub>2</sub>O</p>
     <p>H<sub>2</sub>SO<sub>4</sub></p>

    <!-- 11. SuperScrip  t Tag -->
     <p>2<sup>3</sup></p>
     <p>(a+b)<sup>2</sup>=a<sup>2</sup>+b<sup>2</sup>+2ab</p>

     <!-- 12. preformatted tag -->
     <pre>Twinkle Twinkle 
            Little Star
                Twinkle Twinkle 
                    Little Star
     </pre>
