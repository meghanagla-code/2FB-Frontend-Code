<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div-block{
            border: 2px solid blue;
            background-color: rgb(18, 182, 211);
            width: 200px;
            height: 100px;
            color: white;
            padding : 20px;
            margin : 20px;
        }
        .block{
            margin: 10px;
            display: block;
            border: 2px solid red;
            background-color: yellow;
            color: black;
        }
        .div-inline{
            border: 2px solid blue;
            background-color: rgb(18, 182, 211);
            width: 400px;
            height: 50px;
            color: white;
            padding : 20px;
            margin : 20px;
        }
        .inline{
            margin: 10px;
            display: inline;
            border: 2px solid red;
            background-color: yellow;
            color: black;
        }
        .inline-block{
            margin: 10px;
            display: inline-block;
            width: 100px;
            height: 40px;
            border: 2px solid red;
            background-color: yellow;
            color: black;
            text-align:center;
        }
    </style>
</head>
<body>
    <h2>Block Display</h2>
    <div class="div-block">
        <span class="block">Hiii</span>
        <span class="block">Hello</span>
        <span class="block">Welcome</span>
    </div>
    <h1>Inline Display</h1>
    <div class="div-inline">
        <h2 class="inline">Hii</h2>
        <h2 class="inline">Helloo</h2>
        <h2 class="inline">Welcome</h2>
    </div>
    <h1>Inline -Block Display</h1>
    <div class="div-inline">
        <h2 class="inline-block">Hii</h2>
        <h2 class="inline-block">Helloo</h2>
        <h2 class="inline-block">Welcome</h2>
    </div>
</body>
</html>
