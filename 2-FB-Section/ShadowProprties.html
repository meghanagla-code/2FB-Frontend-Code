<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 2px solid green;
            background-color: aqua;
            width: 100px;
            height: 100px;
            box-shadow: 30px 20px 10px 5px grey;
        }
        .text{
            text-shadow: 3px 3px 1px  grey;
        }
    </style>
</head>
<body>
    <h1>Shadow Properties</h1>
    <h2>Box Shadow</h2>
    <div class="box"></div>
    <h2>Text Shadow</h2>
    <h1 class="text">Pub</h1>
</body>
</html>
